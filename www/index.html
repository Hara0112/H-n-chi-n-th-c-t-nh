<script>
/* ==== net-config.js ==== */
/* Cấu hình mạng. Nếu 2 máy ở mạng di động khác nhau không kết nối được, thêm máy chủ TURN vào danh sách bên dưới. */
window.NET_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
    // , { urls: 'turn:TEN-MAY-CHU:3478', username: 'USER', credential: 'PASS' }
  ]
};

/* ==== net.js ==== */
/* Net: PeerJS (WebRTC) truyền dữ liệu + voice chat. Game logic nằm ở main.js */
(function () {
'use strict';
const cfg = window.NET_CONFIG || {};
const ICE = cfg.iceServers || [{ urls: 'stun:stun.l.google.com:19302' }];
const Net = window.Net = {
  role: null, id: null, hostId: null, peer: null, conns: {}, hostConn: null, seen: {}, lastRecv: Date.now(), ping: 0,
  onMessage() {}, onClose() {}, onOpen() {}, onError() {}
};
function mkPeer(id) {
  const p = new Peer(id, { config: { iceServers: ICE } });
  p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
  return p;
}
function wire(conn) {
  conn.on('data', d => {
    Net.seen[conn.peer] = Date.now(); Net.lastRecv = Date.now();
    if (!d) return;
    if (d.t === 'ping') { try { conn.send({ t: 'pong', ts: d.ts }); } catch (e) {} return; }
    if (d.t === 'pong') { Net.ping = Date.now() - d.ts; return; }
    Net.onMessage(conn.peer, d);
  });
  conn.on('close', () => { delete Net.conns[conn.peer]; Net.onClose(conn.peer); });
  conn.on('error', () => {});
}
Net.createRoom = function (hostId) {
  return new Promise(res => {
    const peer = mkPeer(hostId); let done = false;
    peer.on('open', id => { done = true; Net.peer = peer; Net.id = id; Net.role = 'host'; Net.hostId = id; res({ ok: true, id }); });
    peer.on('error', e => { if (!done) { done = true; try { peer.destroy(); } catch (x) {} res({ ok: false, err: e.type }); } else Net.onError(e); });
    peer.on('connection', conn => {
      wire(conn);
      conn.on('open', () => { Net.conns[conn.peer] = conn; Net.seen[conn.peer] = Date.now(); Net.onOpen(conn.peer); });
    });
    peer.on('call', onCall);
  });
};
Net.joinRoom = function (hostId, hello) {
  return new Promise(res => {
    const peer = mkPeer(undefined); let done = false;
    const fin = r => { if (done) return; done = true; clearTimeout(to); if (!r.ok) { try { peer.destroy(); } catch (e) {} } res(r); };
    const to = setTimeout(() => fin({ ok: false, err: 'timeout' }), 10000);
    peer.on('error', e => { if (done) Net.onError(e); else fin({ ok: false, err: e.type }); });
    peer.on('call', onCall);
    peer.on('open', id => {
      Net.peer = peer; Net.id = id;
      const conn = peer.connect(hostId, { reliable: true, serialization: 'json' });
      conn.on('open', () => { conn.send(hello); });
      conn.on('data', d => {
        Net.lastRecv = Date.now();
        if (!d) return;
        if (!done) {
          if (d.t === 'lobby') { Net.role = 'client'; Net.hostId = hostId; Net.hostConn = conn; Net.conns[hostId] = conn; fin({ ok: true }); Net.onMessage(hostId, d); }
          else if (d.t === 'full' || d.t === 'busy') fin({ ok: false, err: d.t });
          return;
        }
        if (d.t === 'ping') return;
        if (d.t === 'pong') { Net.ping = Date.now() - d.ts; return; }
        Net.onMessage(hostId, d);
      });
      conn.on('close', () => { if (!done) fin({ ok: false, err: 'closed' }); else { delete Net.conns[hostId]; Net.onClose(hostId); } });
      conn.on('error', () => {});
    });
  });
};
Net.send = m => { const c = Net.hostConn; if (c && c.open) { try { c.send(m); } catch (e) {} } };
Net.sendTo = (id, m) => { const c = Net.conns[id]; if (c && c.open) { try { c.send(m); } catch (e) {} } };
Net.bcast = m => { for (const id in Net.conns) Net.sendTo(id, m); };
Net.close = id => { const c = Net.conns[id]; if (!c) return; delete Net.conns[id]; try { c.removeAllListeners('close'); } catch (e) {} try { c.close(); } catch (e) {} };
setInterval(() => { if (Net.role === 'client') Net.send({ t: 'ping', ts: Date.now() }); }, 2000);

/* ---------- Voice ---------- */
const V = Net.voice = { micOk: false, mic: false, spk: true, ptt: false, local: null, ctx: null, calls: {}, audio: {}, ana: {}, speak: {}, vol: {}, _init: null };
function ac() {
  if (!V.ctx) V.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (V.ctx.state === 'suspended') V.ctx.resume();
  return V.ctx;
}
function watch(id, stream) {
  try {
    const c = ac(), src = c.createMediaStreamSource(stream), an = c.createAnalyser();
    an.fftSize = 256; src.connect(an); V.ana[id] = { an, buf: new Uint8Array(an.fftSize) };
  } catch (e) {}
}
V.init = function () {
  if (V._init) return V._init;
  V._init = (async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      s.getAudioTracks().forEach(t => { t.enabled = false; }); V.micOk = true; V.local = s;
    } catch (e) {
      V.micOk = false; // thiếu quyền RECORD_AUDIO: vẫn nghe được, gửi luồng im lặng
      V.local = ac().createMediaStreamDestination().stream;
    }
    watch('__me', V.local);
    return V.local;
  })();
  return V._init;
};
V.retryMic = async function () {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true }); const t = s.getAudioTracks()[0]; t.enabled = false;
    for (const id in V.calls) { const pc = V.calls[id].peerConnection; if (pc) pc.getSenders().forEach(se => { if (se.track && se.track.kind === 'audio') se.replaceTrack(t); }); }
    V.local = s; V.micOk = true; delete V.ana.__me; watch('__me', s); return true;
  } catch (e) { return false; }
};
V.setMic = on => { if (!V.micOk || !V.local) return; V.local.getAudioTracks().forEach(t => { t.enabled = on; }); V.mic = on; };
V.setSpk = on => { V.spk = on; for (const id in V.audio) V.audio[id].muted = !on; };
V.setVol = (id, v) => { V.vol[id] = v; const a = V.audio[id]; if (a) a.volume = Math.max(0, Math.min(1, v)); };
V.speaking = id => id != null && (Date.now() - (V.speak[id === Net.id ? '__me' : id] || 0)) < 400;
function attach(id, stream) {
  detach(id);
  const a = new Audio(); a.srcObject = stream; a.autoplay = true; a.muted = !V.spk; a.volume = V.vol[id] != null ? V.vol[id] : 1;
  a.play().catch(() => {}); V.audio[id] = a; watch(id, stream);
}
function detach(id) {
  const a = V.audio[id]; if (a) { a.pause(); a.srcObject = null; delete V.audio[id]; }
  delete V.ana[id]; delete V.calls[id];
}
function hook(c) {
  V.calls[c.peer] = c;
  c.on('stream', st => attach(c.peer, st));
  c.on('close', () => detach(c.peer));
  c.on('error', () => detach(c.peer));
}
function onCall(c) { V.init().then(s => { c.answer(s); hook(c); }); }
V.connect = function (ids) { // người có id nhỏ hơn gọi người id lớn hơn
  ids.forEach(id => {
    if (!Net.peer || !Net.id || id === Net.id || id <= Net.id || V.calls[id]) return;
    V.init().then(s => { if (V.calls[id]) return; hook(Net.peer.call(id, s)); });
  });
};
setInterval(() => {
  const now = Date.now();
  for (const id in V.ana) {
    const a = V.ana[id]; a.an.getByteTimeDomainData(a.buf); let s = 0;
    for (let i = 0; i < a.buf.length; i++) { const v = (a.buf[i] - 128) / 128; s += v * v; }
    if (Math.sqrt(s / a.buf.length) > .03) V.speak[id] = now;
  }
}, 120);
})();

/* ==== props-data.js ==== */
/* Cấu hình đạo cụ (dữ liệu). Thêm đạo cụ mới: thêm 1 mục, chọn "kind" có sẵn (bomb/banana/lightning/ink/fire) và chỉnh thông số. */
window.PROPS_RULES = { interval: 10, firstDelay: 4, perWave: 4, maxOnField: 10, warn: 1.5 };
window.PROPS = {
  bomb:      { kind: 'bomb', name: 'Bom', icon: '💣', color: 0x333333, weight: 3, fuse: 2.5, throwSpeed: 14, radius: 5, dmg: 30, knock: 2.5, force: 18 },
  banana:    { kind: 'banana', name: 'Vỏ chuối', icon: '🍌', color: 0xfdd835, weight: 3, slip: 2.2, slide: 16, dmg: 5 },
  lightning: { kind: 'lightning', name: 'Sấm sét', icon: '⚡', color: 0xfff59d, weight: 2, range: 16, delay: .6, dmg: 22, stun: 1.3, radius: 2.5 },
  ink:       { kind: 'ink', name: 'Con mực', icon: '🦑', color: 0x6a1b9a, weight: 2, speed: 18, blind: 3, slow: 3 },
  fire:      { kind: 'fire', name: 'Thuốc lửa', icon: '🧪', color: 0xff6d00, weight: 2, range: 8, radius: 3, life: 5, dps: 9 }
};

/* ==== events-data.js ==== */
/* Cấu hình sự kiện môi trường ngẫu nhiên. Chỉnh thời lượng, sát thương, tần suất tại đây. */
window.EVENTS_RULES = { firstMin: 15, firstMax: 25, gapMin: 18, gapMax: 30 };
window.EVENTS = {
  snow:    { name: 'BÃO TUYẾT', icon: '❄', dur: 25, slowMul: .75, accel: 2.5, friction: 1.6, weight: 1 },
  poison:  { name: 'BÃO ĐỘC', icon: '☠', dur: 28, startR: 34, endR: 9, shrinkFrac: .8, dps: 8, weight: 1 },
  meteor:  { name: 'THIÊN THẠCH', icon: '☄', dur: 20, interval: 1.2, count: 2, warn: 1.3, radius: 3.5, dmg: 30, knock: 2.5, force: 16, weight: 1 },
  wind:    { name: 'CUỒNG PHONG', icon: '🌪', dur: 22, force: 5, pullChance: .4, changeEvery: 5, weight: 1 },
  thunder: { name: 'THIÊN LÔI', icon: '🌩', dur: 20, interval: 1.5, count: 3, warn: 1, radius: 3, dmg: 28, knock: 1.3, slowT: 1.5, force: 0, weight: 1 }
};

/* ==== main.js ==== */
/* Chiến Trường Đạo Cụ Hỗn Loạn - Đợt 1: đấu trường, 5 nhân vật, ngã, bế/ném, bot */
(function () {
'use strict';
const A = 25, $ = id => document.getElementById(id);
const CH = [
  { n: 'Đấu Sĩ', r: 'Cận chiến', c: 0xe53935, a: 'S1 Lướt chém · S2 Xoay quét đẩy lùi · ULT Địa chấn', cd: [4, 6] },
  { n: 'Xạ Thủ', r: 'Tầm xa', c: 0x43a047, a: 'S1 Bắn làm chậm · S2 Nhảy lùi đặt bẫy · ULT Mưa đạn', cd: [3, 6] },
  { n: 'Pháp Sư', r: 'Khống chế', c: 0x1e88e5, a: 'S1 Vùng làm chậm · S2 Dịch chuyển · ULT Lốc xoáy hút', cd: [5, 5] },
  { n: 'Đỡ Đòn', r: 'Đỡ đòn / quấy rối', c: 0xfdd835, a: 'S1 Khiên · S2 Sóng xung kích · ULT Pháo đài', cd: [7, 5] },
  { n: 'Sát Thủ', r: 'Cơ động cao', c: 0x8e24aa, a: 'S1 Tàng hình + lướt · S2 Đặt mìn · ULT Ám sát', cd: [6, 4] }
];
const SK = [['Lướt chém', 'Xoay quét', 'Địa chấn'], ['Bắn chậm', 'Nhảy bẫy', 'Mưa đạn'], ['Vùng trói', 'Dịch chuyển', 'Lốc xoáy'], ['Khiên', 'Sóng xung', 'Pháo đài'], ['Tàng hình', 'Đặt mìn', 'Ám sát']];
const OBS = [[8, 8, 1.5], [-8, 8, 1.5], [8, -8, 1.5], [-8, -8, 1.5], [0, 0, 2], [20, 0, 1.2], [-20, 0, 1.2]];
const PADS = [[13, 0], [-13, 0], [0, 13], [0, -13]];
const MODES = { '1v1': 2, '2v2': 4, '3v3': 6, 'ffa': 6 };
const MODE_NAME = { '1v1': '1v1', '2v2': '2v2', '3v3': '3v3', 'ffa': 'Hỗn chiến' };

let scene, camera, renderer, ents = [], projs = [], mines = [], zones = [], fxs = [];
let objs = [], pickups = [], timers = [], spawnT = 4;
let ev = null, evT = 20, flash = 0, lastEv = null;
const EV = window.EVENTS, ER = window.EVENTS_RULES;
let myId = 'local', voiceMode = 'mix', locked = false, snapT = 0, inT = 0, cev = null;
const bc = m => { if (Net.role === 'host') Net.bcast(m); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PR = window.PROPS, RL = window.PROPS_RULES;
let mode = '1v1', goal = 10, pick = 0, scores = [0, 0], running = false, P = null, last = 0;
const sphereG = new THREE.SphereGeometry(.3, 8, 6);

/* ---------- helpers ---------- */

  if (e && (e.type === 'network' || e.type === 'server-error')) feed('⚠ Mạng không ổn định (' + e.type + ')', true);
};
const ERR = { 'peer-unavailable': 'Không tìm thấy phòng', full: 'Phòng đã đầy', busy: 'Phòng đã bắt đầu', timeout: 'Hết thời gian chờ — kiểm tra mạng', network: 'Không có mạng', closed: 'Kết nối bị đóng' };
const setStatus = t => { $('oStatus').textContent = t; };
const roomId = code => 'chaos-' + code.toLowerCase();
async function hostRoom(code, quick) {
  const r = await Net.createRoom(roomId(code));
  if (!r.ok) return r;
  myId = Net.id; lob.code = code; lob.quick = quick; lob.players = [{ owner: myId, name: cleanName($('pname').value), pick }];
  Net.voice.init().then(updVHud); showLobby(); bcastLobby(); return r;
}
async function joinRoom(code) {
  const r = await Net.joinRoom(roomId(code), { t: 'hello', name: cleanName($('pname').value), pick });
  if (r.ok) { myId = Net.id; Net.voice.init().then(updVHud); }
  return r;
}
async function quickMatch() {
  let tries = 0;
  for (let i = 0; i < 6 && tries < 12; i++, tries++) {
    const code = 'Q-' + mode.toUpperCase() + '-' + i;
    setStatus('Đang tìm phòng ' + MODE_NAME[mode] + '… (' + (i + 1) + ')');
    const r = await joinRoom(code);
    if (r.ok) return;
    if (r.err === 'peer-unavailable') {
      const c = await hostRoom(code, true);
      if (c.ok) return;
      i--; continue; // vừa có người khác tạo — thử vào lại
    }
    if (r.err === 'network' || r.err === 'timeout') { setStatus(ERR[r.err] || 'Lỗi mạng'); return; }
  }
  setStatus('Chưa tìm được phòng. Thử lại hoặc tạo phòng riêng.');
}
function updVHud() {
  const V = Net.voice;
  $('bMic').textContent = !V.micOk ? '🚫' : (V.mic ? '🎤' : '🔇'); $('bMic').classList.toggle('on', V.mic);
  $('bSpk').textContent = V.spk ? '🔊' : '🔈'; $('bPtt').textContent = V.ptt ? 'Giữ nói' : 'Bật/tắt';
}
function vVol(e) {
  const prox = Math.max(0, 1 - dist(P, e) / 22), same = mode !== 'ffa' && e.team === P.team;
  if (mode === 'ffa' || voiceMode === 'prox') return prox;
  if (voiceMode === 'team') return same ? 1 : 0;
  return same ? 1 : prox * .6;
}
function initOnline() {
  $('pname').value = 'Người chơi' + (10 + Math.floor(Math.random() * 90));
  $('bOnline').onclick = () => { $('menu').style.display = 'none'; $('online').style.display = 'flex'; setStatus(''); };
  $('bOBack').onclick = () => { $('online').style.display = 'none'; $('menu').style.display = 'flex'; };
  $('bQuick').onclick = quickMatch;
  $('bCreate').onclick = async () => {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code = '';
    for (let i = 0; i < 5; i++) code += A[Math.floor(Math.random() * A.length)];
    setStatus('Đang tạo phòng…'); const r = await hostRoom(code, false);
    if (!r.ok) setStatus('Không tạo được phòng: ' + (ERR[r.err] || r.err));
  };
  $('bJoin').onclick = async () => {
    const code = $('pcode').value.trim().toUpperCase(); if (!code) { setStatus('Nhập mã phòng'); return; }
    setStatus('Đang vào phòng…'); const r = await joinRoom(code);
    if (!r.ok) setStatus(ERR[r.err] || ('Lỗi: ' + r.err));
  };
  $('bGo').onclick = startOnline;
  $('bLeave').onclick = () => location.reload();
  [['team', 'Đội'], ['prox', 'Gần'], ['mix', 'Đội + gần']].forEach(([v, t]) => {
    const b = document.createElement('button'); b.textContent = 'Voice: ' + t; b.dataset.v = v;
    b.onclick = () => { voiceMode = v; bcastLobby(); }; $('lVoice').appendChild(b);
  });
  const V = Net.voice, mic = $('bMic');
  mic.addEventListener('pointerdown', async e => {
    e.preventDefault();
    if (!V.micOk) {
      const ok = await V.retryMic(); updVHud();
      feed(ok ? 'Đã bật micro — bấm lại để nói' : 'Chưa có quyền micro. Vào Cài đặt > Ứng dụng > Quyền để cấp, chỉ nghe được.', true); return;
    }
    if (V.ptt) V.setMic(true); else V.setMic(!V.mic); updVHud();
  });
  const rel = () => { if (V.ptt) { V.setMic(false); updVHud(); } };
  mic.addEventListener('pointerup', rel); mic.addEventListener('pointercancel', rel); mic.addEventListener('pointerleave', rel);
  $('bSpk').onclick = () => { V.setSpk(!V.spk); updVHud(); };
  $('bPtt').onclick = () => { V.ptt = !V.ptt; V.setMic(false); updVHud(); };
  updVHud();
  setInterval(() => {
    if (!P || !Net.role) return;
    for (const e of ents) if (e.owner && e.owner !== myId) Net.voice.setVol(e.owner, vVol(e));
  }, 250);
  setInterval(() => {
    $('ping').textContent = Net.role === 'client' ? '📶 ' + Net.ping + 'ms' : (Net.role === 'host' ? '👑 Chủ phòng' : '');
    const now = Date.now();
    if (Net.role === 'client' && now - Net.lastRecv > 8000 && $('lost').style.display !== 'flex') lost('Mất kết nối (không nhận được dữ liệu).');
    if (Net.role === 'host') for (const id in Net.conns) if (now - (Net.seen[id] || now) > 9000) dropPlayer(id);
  }, 1000);
}

initScene(); initInput(); initMenu(); initOnline(); requestAnimationFrame(loop);
})();

</script>
