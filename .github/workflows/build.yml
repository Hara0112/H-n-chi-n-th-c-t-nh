name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cài thư viện, đóng gói thẳng vào APK (không cần mạng để tải thư viện)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.128.0 peerjs@1.5.4
          mkdir -p www/js
          cp node_modules/three/build/three.min.js www/js/three.min.js
          cp node_modules/peerjs/dist/peerjs.min.js www/js/peerjs.min.js
          test -s www/js/three.min.js && test -s www/js/peerjs.min.js
      - name: Tạo dự án Android
        run: |
          npx cap init "Chien Truong Dao Cu" com.hara.chaosarena --web-dir www
          npx cap add android
      - name: Đổi icon + màn hình chờ thành ảnh avatar game
        continue-on-error: true
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import re, base64, glob, os, shutil
          from PIL import Image
          h = open('www/index.html', encoding='utf-8').read()
          m = re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)', h)
          open('icon.jpg', 'wb').write(base64.b64decode(m.group(1)))
          im = Image.open('icon.jpg').convert('RGB')
          R = 'android/app/src/main/res'
          shutil.rmtree(R + '/mipmap-anydpi-v26', ignore_errors=True)
          for n, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              os.makedirs(R + '/mipmap-' + n, exist_ok=True)
              for f in ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground']:
                  im.resize((s, s), Image.LANCZOS).save(R + '/mipmap-' + n + '/' + f + '.png')
          for f in glob.glob(R + '/**/splash*.png', recursive=True):
              W, H = Image.open(f).size
              bg = Image.new('RGB', (W, H), (18, 10, 38)); S = H // 2
              bg.paste(im.resize((S, S), Image.LANCZOS), ((W - S) // 2, (H - S) // 2)); bg.save(f)
          print('icon done')
          PY
      - name: Quyền + xoay ngang
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/></manifest>#' $M
          sed -i '0,/<activity/s##<activity android:screenOrientation="sensorLandscape"#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChaosArena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build + ký bản release (chỉ chạy khi có secrets)
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | base64 -d > release.jks
          cd android && ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          $BT/zipalign -p 4 "$UN" aligned.apk
          $BT/apksigner sign --ks ../release.jks --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias $KS_ALIAS --out ChaosArena-release.apk aligned.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.KS != '' }}
        with:
          name: ChaosArena-release-APK
          path: android/ChaosArena-release.apk
